<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gear-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8ecef"/>
      <stop offset="35%" stop-color="#9aa4ab"/>
      <stop offset="60%" stop-color="#5b6468"/>
      <stop offset="100%" stop-color="#2b3133"/>
    </linearGradient>
    <linearGradient id="bot-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232b27"/>
      <stop offset="55%" stop-color="#121715"/>
      <stop offset="100%" stop-color="#050806"/>
    </linearGradient>
    <linearGradient id="shield-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cfd6da"/>
      <stop offset="50%" stop-color="#848e93"/>
      <stop offset="100%" stop-color="#3b4245"/>
    </linearGradient>
    <linearGradient id="phone-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a211d"/>
      <stop offset="100%" stop-color="#050706"/>
    </linearGradient>
    <radialGradient id="eye-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8dffb0"/>
      <stop offset="45%" stop-color="#34ff7a"/>
      <stop offset="100%" stop-color="#17c95c" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="wide-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <g transform="translate(256 256) scale(0.88) translate(-256 -256)">

  <!-- orbit swoosh -->
  <g opacity="0.55" transform="rotate(-18 256 256)">
    <ellipse cx="256" cy="256" rx="240" ry="92" fill="none" stroke="#c9d2d6" stroke-width="7"/>
  </g>

  <!-- gear backdrop -->
  <g transform="translate(256 256)">
    <path fill="url(#gear-metal)" stroke="#20262a" stroke-width="4" d="
      M -18 -234 L 18 -234 L 24 -196 L 60 -186 L 84 -216 L 118 -196 L 104 -160 L 132 -136
      L 170 -150 L 192 -118 L 164 -94 L 178 -58 L 216 -54 L 220 -16 L 184 -4 L 184 34
      L 220 46 L 216 84 L 178 88 L 164 124 L 192 148 L 170 180 L 132 166 L 104 190
      L 118 226 L 84 246 L 60 216 L 24 226 L 18 264 L -18 264 L -24 226 L -60 216
      L -84 246 L -118 226 L -104 190 L -132 166 L -170 180 L -192 148 L -164 124
      L -178 88 L -216 84 L -220 46 L -184 34 L -184 -4 L -220 -16 L -216 -54
      L -178 -58 L -164 -94 L -192 -118 L -170 -150 L -132 -136 L -104 -160
      L -118 -196 L -84 -216 L -60 -186 L -24 -196 Z"/>
    <circle r="178" fill="none" stroke="#10100f" stroke-width="3" opacity="0.35"/>
  </g>

  <!-- android bot head / body -->
  <g>
    <!-- antennae -->
    <g stroke="#34ff7a" stroke-width="10" stroke-linecap="round" filter="url(#soft-glow)">
      <line x1="196" y1="130" x2="168" y2="78"/>
      <line x1="316" y1="130" x2="344" y2="78"/>
    </g>
    <g stroke="#0d130f" stroke-width="16" stroke-linecap="round">
      <line x1="196" y1="130" x2="168" y2="78"/>
      <line x1="316" y1="130" x2="344" y2="78"/>
    </g>

    <!-- dome head -->
    <path fill="url(#bot-body)" stroke="#000000" stroke-width="3" d="
      M 150 210
      C 150 122, 190 96, 256 96
      C 322 96, 362 122, 362 210
      L 362 236 L 150 236 Z"/>

    <!-- eyes -->
    <g filter="url(#soft-glow)">
      <path fill="#34ff7a" d="M 188 168 L 236 160 L 232 190 L 188 192 Z"/>
      <path fill="#34ff7a" d="M 324 168 L 276 160 L 280 190 L 324 192 Z"/>
    </g>

    <!-- shoulders / torso -->
    <path fill="url(#bot-body)" stroke="#000000" stroke-width="3" d="
      M 120 236
      L 392 236
      L 400 320
      C 400 372, 362 404, 256 404
      C 150 404, 112 372, 112 320 Z"/>

    <!-- arm pods -->
    <circle cx="112" cy="300" r="34" fill="url(#bot-body)" stroke="#000" stroke-width="3"/>
    <circle cx="400" cy="300" r="34" fill="url(#bot-body)" stroke="#000" stroke-width="3"/>
    <g stroke="#34ff7a" stroke-width="5" opacity="0.9">
      <path fill="none" d="M 96 290 Q 112 300 96 312"/>
      <path fill="none" d="M 416 290 Q 400 300 416 312"/>
    </g>
  </g>

  <!-- shield with terminal glyph -->
  <g transform="translate(256 300)">
    <path fill="url(#shield-metal)" stroke="#1b1f21" stroke-width="4" d="
      M 0 -58 L 62 -36 C 62 20, 38 60, 0 80 C -38 60, -62 20, -62 -36 Z"/>
    <path fill="url(#bot-body)" d="
      M 0 -42 L 46 -26 C 46 16, 28 46, 0 62 C -28 46, -46 16, -46 -26 Z"/>
    <g filter="url(#soft-glow)">
      <path fill="none" stroke="#34ff7a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
            d="M -22 -18 L -2 0 L -22 18"/>
      <line x1="4" y1="24" x2="30" y2="24" stroke="#34ff7a" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- phone with download / sync glyphs -->
  <g transform="translate(256 424)">
    <rect x="-118" y="-30" width="236" height="84" rx="18" fill="url(#phone-body)" stroke="url(#shield-metal)" stroke-width="5"/>
    <line x1="0" y1="-16" x2="0" y2="38" stroke="#3a4247" stroke-width="3"/>

    <!-- download glyph: arrow into tray -->
    <g stroke="#e8ecef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M -59 -14 L -59 10"/>
      <path d="M -70 0 L -59 12 L -48 0"/>
      <path d="M -72 22 L -46 22"/>
    </g>

    <!-- sync glyph: single circular refresh arrow -->
    <g stroke="#e8ecef" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 44 -16 A 19 19 0 1 1 25 2"/>
      <path d="M 33 -20 L 44 -16 L 41 -4"/>
    </g>

    <!-- USB-C port -->
    <rect x="-9" y="48" width="18" height="7" rx="3" fill="#0a0d0b"/>
  </g>

  </g>
</svg>
